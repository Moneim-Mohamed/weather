<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather</title>
    <!-- *** Roboto Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- *** bootstrap -->
    <link rel="stylesheet" href="./Assets/Css/bootstrap.min.css" />

    <!-- *** Fona Awsome -->
    <link rel="stylesheet" href="./Assets/Css/all.min.css" />

    <!-- *** Media style -->
    <link rel="stylesheet" href="./Assets/Css/media.css" />

    <!-- *** Main style sheet -->
    <link rel="stylesheet" href="./Assets/Css/style.css" />
  </head>
  <body>
    <main>
      <section class="Head">
        <div class="header">
          <nav class="navbar navbar-expand-lg">
            <div class="container">
              <div>
                <img
                  src="./Assets/Gallery/logo@2x.png"
                  alt="logo"
                  class="img-fluid"
                  width="64"
                  height="38"
                />
                <div class="adderss d-inline-block align-middle">
                  <h1 class="navbar-brand mb-1 mx-1 p-0 text-white" href="#">
                    Weather
                  </h1>

                  <small class="text-white mx-1">tagline goes here</small>
                </div>
              </div>

              <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent"
                aria-expanded="false"
                aria-label="Toggle navigation"
              >
                <span class="navbar-toggler-icon"></span>
              </button>
              <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 gap-2">
                  <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="#"
                      >Home</a
                    >
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">News</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link btn" href="#">Live Cameras</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#">Photos</a>
                  </li>
                  <li class="nav-item">
                    <a class="nav-link" href="#" id="contact">Contact</a>
                  </li>
                </ul>
              </div>
            </div>
          </nav>
        </div>
      </section>
      <div class="form">
        <div class="container">
          <form class="d-flex justify-content-center align-items-center mt-5">
            <div class="input-group">
              <input
                type="text"
                class="form-control p-3"
                placeholder="Find Your Location..."
                aria-label="Find Your Location"
                aria-describedby="button-addon2"
                id="locationInput"
              />
              <button
                class="btn rounded-pill px-4"
                type="button"
                id="button-addon2"
              >
                Find
              </button>
            </div>
          </form>
        </div>
      </div>
      <!-- **** Content -->
      <div class="content">
        <div class="container">
          <div class="cards">
            <div class="row content-container gy-2"></div>
          </div>
        </div>
      </div>
      <!-- ******** Footer -->
      <section class="footer mt-5">
        <div class="container">
          <div
            class="footer-content row gy-4 align-items-center text-center text-lg-start"
          >
            <div class="col-12 col-lg-6">
              <form>
                <div class="input-group position-relative mx-auto">
                  <input
                    type="text"
                    class="form-control p-3"
                    placeholder="Enter Your Email To Subscribe..."
                    aria-label="Find Your Location"
                    aria-describedby="button-addon2"
                    id="locationInput"
                  />
                  <button
                    class="btn rounded-pill px-4"
                    type="button"
                    id="button-addon2"
                  >
                    Subscribe
                  </button>
                </div>
              </form>
            </div>
            <div class="col-12 col-lg-6">
              <div
                class="social d-flex justify-content-center justify-content-lg-end flex-wrap"
              >
                <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-google-plus-g"></i></a>
                <a href="#"><i class="fa-brands fa-pinterest"></i></a>
              </div>
            </div>
          </div>
          <p class="text-center mt-4 mb-0 small text-white-50">
            Copyright 2014 Company name. Designed by Themezy. All rights
            reserved
          </p>
        </div>
      </section>
    </main>
    <!-- *** Bootstrap Js -->
    <script src="./JS/bootstrap.bundle.min.js"></script>
    <!-- *** Main Js File-->
    <script src="./JS/index.js"></script>
  </body>
</html>
